<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Pengaduan - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

    <!-- MODAL LOGIN -->
    <div class="modal fade" id="loginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Login Admin Pengaduan</h5>
                </div>
                <div class="modal-body">
                    <div id="loginAlert"></div>
                    <form id="formLogin">
                        <div class="mb-3">
                            <label class="form-label">Password Admin</label>
                            <input type="password" id="passwordAdmin" class="form-control" required placeholder="Default: admin123">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Masuk</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- HALAMAN REGISTER ADMIN -->
    <div class="container-fluid d-none" id="adminContent">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Database Pengaduan (Google Sheets)</h2>
            <div>
                <a href="index.html" class="btn btn-outline-secondary me-2">&larr; Ke Form Public</a>
                <button onclick="logout()" class="btn btn-danger">Logout</button>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-dark text-center">
                            <tr>
                                <th>No</th>
                                <th>Petugas</th>
                                <th>Tanggal & Pelapor</th>
                                <th>Judul & Isi Laporan</th>
                                <th>Sumber / Kategori</th>
                                <th>Bukti</th>
                                <th>Tindak Lanjut</th>
                                <th>Status SP4N</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelData">
                            <tr><td colspan="10" class="text-center">Memuat data dari Google Sheets...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL TINDAK LANJUT -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Proses Pengaduan</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formTindakLanjut">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Nama Petugas Pengaduan <span class="text-danger">*</span></label>
                            <input type="text" id="editPetugas" class="form-control" required placeholder="Misal: Listia">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Keterangan Tindak Lanjut <span class="text-danger">*</span></label>
                            <textarea id="editTindakLanjut" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Status SP4N</label>
                                <select id="editSp4n" class="form-select">
                                    <option value="Belum Entri">Belum Entri</option>
                                    <option value="Sudah Entri">Sudah Entri</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Status Laporan</label>
                                <select id="editStatus" class="form-select">
                                    <option value="Menunggu">Menunggu</option>
                                    <option value="Diproses">Diproses</option>
                                    <option value="Selesai">Selesai</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" id="btnSave" class="btn btn-success w-100">Simpan Perubahan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // MASUKKAN URL GOOGLE APPS SCRIPT KAMU DI SINI
        const API_URL = "URL_GOOGLE_APPS_SCRIPT_KAMU";

        const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
        const editModal = new bootstrap.Modal(document.getElementById('editModal'));
        let currentData = [];

        window.onload = () => {
            if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                showAdminContent();
            } else {
                loginModal.show();
            }
        };

        // Handle Login
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('passwordAdmin').value;

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: "login", password })
            });

            const result = await res.json();
            if (result.success) {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                loginModal.hide();
                showAdminContent();
            } else {
                document.getElementById('loginAlert').innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
            }
        });

        function logout() {
            sessionStorage.removeItem('isAdminLoggedIn');
            location.reload();
        }

        function showAdminContent() {
            document.getElementById('adminContent').classList.remove('d-none');
            loadData();
        }

        async function loadData() {
            const res = await fetch(API_URL);
            const result = await res.json();
            currentData = result.data;

            const tbody = document.getElementById('tabelData');
            tbody.innerHTML = '';

            if (currentData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center">Belum ada pengaduan.</td></tr>`;
                return;
            }

            currentData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center">${index + 1}</td>
                    <td><strong>${item.petugas_pengaduan}</strong></td>
                    <td><small class="text-muted">${item.tanggal_pengaduan}</small><br><strong>${item.nama_pelapor}</strong></td>
                    <td><strong>${item.judul_laporan}</strong><p class="mb-0 text-muted small">${item.isi_laporan}</p></td>
                    <td><span class="badge bg-secondary">${item.sumber_laporan}</span></td>
                    <td class="text-center">
                        ${item.bukti_pengaduan ? `<a href="${item.bukti_pengaduan}" target="_blank"><img src="${item.bukti_pengaduan}" width="50" class="img-thumbnail"></a>` : '-'}
                    </td>
                    <td><small>${item.tindak_lanjut}</small></td>
                    <td class="text-center"><span class="badge ${item.status_sp4n_lapor === 'Sudah Entri' ? 'bg-success' : 'bg-warning text-dark'}">${item.status_sp4n_lapor}</span></td>
                    <td class="text-center"><span class="badge ${item.status_pengaduan === 'Selesai' ? 'bg-success' : 'bg-warning text-dark'}">${item.status_pengaduan}</span></td>
                    <td class="text-center"><button class="btn btn-sm btn-primary" onclick="openEdit('${item.id}')">Proses</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openEdit(id) {
            const item = currentData.find(d => d.id == id);
            if (item) {
                document.getElementById('editId').value = item.id;
                document.getElementById('editPetugas').value = item.petugas_pengaduan !== '-' ? item.petugas_pengaduan : '';
                document.getElementById('editTindakLanjut').value = item.tindak_lanjut !== '-' ? item.tindak_lanjut : '';
                document.getElementById('editSp4n').value = item.status_sp4n_lapor;
                document.getElementById('editStatus').value = item.status_pengaduan;
                editModal.show();
            }
        }

        document.getElementById('formTindakLanjut').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSave = document.getElementById('btnSave');
            btnSave.disabled = true;

            const payload = {
                action: "update",
                id: document.getElementById('editId').value,
                petugas_pengaduan: document.getElementById('editPetugas').value,
                tindak_lanjut: document.getElementById('editTindakLanjut').value,
                status_sp4n_lapor: document.getElementById('editSp4n').value,
                status_pengaduan: document.getElementById('editStatus').value
            };

            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            editModal.hide();
            btnSave.disabled = false;
            setTimeout(() => loadData(), 1500); // Reload setelah delay sebentar
        });
    </script>
</body>
</html>
