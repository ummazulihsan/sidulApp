<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - SiDul BPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --bps-blue: #043277; }
        .bg-bps { background-color: var(--bps-blue); }
    </style>
</head>
<body class="bg-light p-4">

    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-bps text-white rounded shadow-sm">
            <h3 class="mb-0 fw-bold">Panel Admin SiDul BPS</h3>
            <a href="index.html" class="btn btn-outline-light btn-sm">&larr; Ke Halaman Publik</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-dark text-center">
                            <tr>
                                <th>No</th>
                                <th>Tanggal</th>
                                <th>ID Laporan</th>
                                <th>Nama Pelapor</th>
                                <th>Kontak</th>
                                <th>Kategori</th>
                                <th>Isi Pengaduan</th>
                                <th>Bukti</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="adminTabel">
                            <tr><td colspan="9" class="text-center py-4">Memuat data pengaduan...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const URL_GAS = 'https://script.google.com/macros/s/AKfycbyczkHNYHIEN74llwc7oE63wEIqELWJRY6DopS9VI9Enit1R8KOAXp1tW3hG8cRA-9Y0Q/exec';

        async function loadAdminData() {
            try {
                const res = await fetch(URL_GAS);
                const data = await res.json();
                const tbody = document.getElementById('adminTabel');
                tbody.innerHTML = '';

                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="9" class="text-center">Belum ada pengaduan.</td></tr>`;
                    return;
                }

                data.forEach((item, index) => {
                    const tgl = new Date(item.timestamp).toLocaleString('id-ID');
                    const link = (item.bukti && item.bukti !== "Tidak ada bukti") 
                        ? `<a href="${item.bukti}" target="_blank" class="btn btn-sm btn-outline-info">Buka File</a>` : '-';

                    tbody.innerHTML += `
                        <tr>
                            <td class="text-center">${index + 1}</td>
                            <td><small>${tgl}</small></td>
                            <td><span class="badge bg-secondary">${item.reportId}</span></td>
                            <td><strong>${item.nama_pelapor || '-'}</strong></td>
                            <td>${item.kontak || '-'}</td>
                            <td><span class="badge bg-primary">${item.kategori}</span></td>
                            <td>${item.isiAduan}</td>
                            <td class="text-center">${link}</td>
                            <td class="text-center fw-bold">${item.status}</td>
                        </tr>
                    `;
                });
            } catch(e) {
                console.error(e);
            }
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
