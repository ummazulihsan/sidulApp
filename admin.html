<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Pengaduan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

    <!-- MODAL LOGIN -->
    <div class="modal fade" id="loginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Login Admin Pengaduan</h5>
                </div>
                <div class="modal-body">
                    <div id="loginAlert"></div>
                    <form id="formLogin">
                        <div class="mb-3">
                            <label class="form-label">Password Admin</label>
                            <input type="password" id="passwordAdmin" class="form-control" required placeholder="Default: admin123">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Masuk</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- REGISTER DASHBOARD -->
    <div class="container-fluid d-none" id="adminContent">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Register Database Pengaduan</h2>
            <div>
                <a href="index.html" class="btn btn-outline-secondary me-2">&larr; Ke Form Public</a>
                <button onclick="logout()" class="btn btn-danger">Logout</button>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-dark text-center">
                            <tr>
                                <th>No</th>
                                <th>Timestamp</th>
                                <th>ID Laporan</th>
                                <th>Nama Pelapor</th>
                                <th>Kontak</th>
                                <th>Kategori</th>
                                <th>Isi Pengaduan</th>
                                <th>Link Bukti</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelData">
                            <tr><td colspan="10" class="text-center">Memuat data dari Google Sheets...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL EDIT STATUS -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Update Status Pengaduan</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formStatus">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Pilih Status Baru</label>
                            <select id="editStatus" class="form-select">
                                <option value="Menunggu">Menunggu</option>
                                <option value="Diproses">Diproses</option>
                                <option value="Selesai">Selesai</option>
                                <option value="Ditolak">Ditolak</option>
                            </select>
                        </div>
                        <button type="submit" id="btnSave" class="btn btn-success w-100">Simpan Perubahan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // MASUKKAN URL GOOGLE APPS SCRIPT KAMU DI SINI
        const API_URL = "URL_GOOGLE_APPS_SCRIPT_KAMU";

        const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
        const editModal = new bootstrap.Modal(document.getElementById('editModal'));
        let currentData = [];

        window.onload = () => {
            if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                showAdminContent();
            } else {
                loginModal.show();
            }
        };

        // Process Login
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('passwordAdmin').value;

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: "login", password })
            });

            const result = await res.json();
            if (result.success) {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                loginModal.hide();
                showAdminContent();
            } else {
                document.getElementById('loginAlert').innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
            }
        });

        function logout() {
            sessionStorage.removeItem('isAdminLoggedIn');
            location.reload();
        }

        function showAdminContent() {
            document.getElementById('adminContent').classList.remove('d-none');
            loadData();
        }

        async function loadData() {
            const res = await fetch(API_URL);
            const result = await res.json();
            currentData = result.data;

            const tbody = document.getElementById('tabelData');
            tbody.innerHTML = '';

            if (currentData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center">Belum ada pengaduan.</td></tr>`;
                return;
            }

            currentData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center">${index + 1}</td>
                    <td><small class="text-muted">${item.timestamp}</small></td>
                    <td><span class="badge bg-dark">${item.id_laporan}</span></td>
                    <td><strong>${item.nama_pelapor}</strong></td>
                    <td>${item.kontak}</td>
                    <td><span class="badge bg-secondary">${item.kategori}</span></td>
                    <td>${item.isi_pengaduan}</td>
                    <td class="text-center">
                        ${item.link_bukti && item.link_bukti !== '-' ? `<a href="${item.link_bukti}" target="_blank" class="btn btn-sm btn-outline-info">Buka Link</a>` : '-'}
                    </td>
                    <td class="text-center">
                        <span class="badge ${item.status === 'Selesai' ? 'bg-success' : (item.status === 'Diproses' ? 'bg-info' : (item.status === 'Ditolak' ? 'bg-danger' : 'bg-warning text-dark'))}">
                            ${item.status}
                        </span>
                    </td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-primary" onclick="openEdit('${item.id_laporan}')">Ubah Status</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openEdit(idLaporan) {
            const item = currentData.find(d => d.id_laporan == idLaporan);
            if (item) {
                document.getElementById('editId').value = item.id_laporan;
                document.getElementById('editStatus').value = item.status;
                editModal.show();
            }
        }

        document.getElementById('formStatus').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSave = document.getElementById('btnSave');
            btnSave.disabled = true;

            const payload = {
                action: "update",
                id_laporan: document.getElementById('editId').value,
                status: document.getElementById('editStatus').value
            };

            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            editModal.hide();
            btnSave.disabled = false;
            setTimeout(() => loadData(), 1500);
        });
    </script>
</body>
</html>
