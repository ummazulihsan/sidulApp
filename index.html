<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Pengaduan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">Form Pengaduan Publik</h4>
            </div>
            <div class="card-body p-4">

                <div id="alertBox"></div>

                <form id="formPengaduan">
                    <div class="mb-3">
                        <label class="form-label">Nama Pelapor <span class="text-danger">*</span></label>
                        <input type="text" id="nama_pelapor" class="form-control" required placeholder="Masukkan nama lengkap">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Kontak (No HP / WA / Email) <span class="text-danger">*</span></label>
                        <input type="text" id="kontak" class="form-control" required placeholder="Contoh: 08123456789">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Kategori <span class="text-danger">*</span></label>
                        <select id="kategori" class="form-select" required>
                            <option value="Pelayanan Umum">Pelayanan Umum</option>
                            <option value="Layanan Statistik">Layanan Statistik</option>
                            <option value="Infrastruktur & Sarana">Infrastruktur & Sarana</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Isi Pengaduan <span class="text-danger">*</span></label>
                        <textarea id="isi_pengaduan" class="form-control" rows="4" required placeholder="Jelaskan detail pengaduan kamu..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Link Bukti (Opsional)</label>
                        <input type="url" id="link_bukti" class="form-control" placeholder="Contoh: Link Google Drive / Foto">
                    </div>

                    <button type="submit" id="btnSubmit" class="btn btn-primary w-100 py-2 fs-5">Kirim Pengaduan</button>
                </form>

                <div class="text-center mt-3">
                    <a href="admin.html" class="text-decoration-none">&larr; Masuk ke Halaman Admin</a>
                </div>
            </div>
        </div>
    </div>

<script>
    // MASUKKAN URL GOOGLE APPS SCRIPT KAMU DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbxAoO3vUJ5FLCyR1zMH3iau5a9MdQFwuZ8dXuKtowzBjY8Pm67TVq5g6euCw6xIdadrCA/exec";

    document.getElementById('formPengaduan').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btnSubmit = document.getElementById('btnSubmit');
        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Mengirim...';

        const payload = {
            action: "create",
            nama_pelapor: document.getElementById('nama_pelapor').value,
            kontak: document.getElementById('kontak').value,
            kategori: document.getElementById('kategori').value,
            isi_pengaduan: document.getElementById('isi_pengaduan').value,
            link_bukti: document.getElementById('link_bukti').value
        };

        try {
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            document.getElementById('alertBox').innerHTML = `<div class="alert alert-success">Pengaduan berhasil terkirim dan tercatat di sistem!</div>`;
            document.getElementById('formPengaduan').reset();
        } catch(err) {
            document.getElementById('alertBox').innerHTML = `<div class="alert alert-danger">Gagal mengirim pengaduan.</div>`;
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerText = 'Kirim Pengaduan';
        }
    });
</script>
</body>
</html>
