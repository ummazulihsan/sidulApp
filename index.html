<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiDul - Sistem Informasi Pengaduan Layanan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* PALET WARNA BPS */
        :root { 
            --bps-blue: #043277;    /* Biru Utama BPS */
            --bps-orange: #F7941D;  /* Oranye BPS */
            --bps-green: #00A651;   /* Hijau BPS */
            --bps-light-blue: #0072BC; 
            --background: #f4f7fa;
        }

        body { background-color: var(--background); font-family: 'Inter', sans-serif; }
        
        /* Navbar dengan Biru BPS */
        .navbar { background-color: var(--bps-blue); border-bottom: 4px solid var(--bps-orange); }
        .logo-img { height: 55px; width: 55px; border: 2px solid #fff; }

        /* Tombol Utama */
        .btn-primary { background-color: var(--bps-blue); border: none; }
        .btn-primary:hover { background-color: var(--bps-light-blue); }

        .card { border-radius: 8px; border: none; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark shadow-sm">
        <div class="container py-1">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="logo_sidulApp.jpeg" alt="Logo SiDul" class="logo-img rounded-circle me-3">
                <div>
                    <h4 class="fw-bold mb-0">SiDul - Sistem Informasi Pengaduan Layanan</h4>
                    <small class="text-white-50">Transparansi Pengaduan dalam Genggaman Data</small>
                </div>
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <!-- HEADER FORM DENGAN TOMBOL LOGIN ADMIN -->
                        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                            <h5 class="fw-bold mb-0" style="color: var(--bps-blue)">Formulir Layanan Pengaduan</h5>
                            <a href="admin.html" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-bold">
                                🔑 Login Admin
                            </a>
                        </div>

                        <form id="formPengaduan">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nama Lengkap</label>
                                    <input type="text" id="inp-nama" class="form-control shadow-sm" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Kontak (WA/Email)</label>
                                    <input type="text" id="inp-kontak" class="form-control shadow-sm" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Kategori Laporan</label>
                                    <select id="inp-kategori" class="form-select shadow-sm">
                                        <option value="Fraud">Fraud</option>
                                        <option value="Kepegawaian">Kepegawaian</option>
                                        <option value="Konflik Kepentingan">Konflik Kepentingan</option>
                                        <option value="Pelayanan Statistik">Pelayanan Statistik</option>
                                        <option value="Lainnya">Lainnya</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Deskripsi Aduan</label>
                                    <textarea id="inp-isi" class="form-control shadow-sm" rows="4" required></textarea>
                                </div>
                                <div class="col-12 mb-3">
                                    <label class="form-label fw-bold" style="color: var(--bps-blue)">Upload Bukti Otentik (PDF/JPG/PNG)</label>
                                    <input type="file" id="inp-file" class="form-control shadow-sm" accept="image/*,.pdf">
                                    <small class="text-muted">Maksimal ukuran file: 5MB</small>
                                </div>
                                <div class="col-12 text-end">
                                    <button type="submit" id="btn-kirim" class="btn btn-primary px-5 py-2 fw-bold">KIRIM LAPORAN</button>
                                </div>
                            </div>
                        </form>
                        <div id="notif-form" class="mt-3 d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-5">
        <p class="text-muted small">© 2026 SiDul - BPS Provinsi Kepulauan Bangka Belitung</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const URL_GAS = 'https://script.google.com/macros/s/AKfycbyczkHNYHIEN74llwc7oE63wEIqELWJRY6DopS9VI9Enit1R8KOAXp1tW3hG8cRA-9Y0Q/exec';
        const form = document.getElementById('formPengaduan');
        const fileInput = document.getElementById('inp-file');
        const btnSubmit = document.getElementById('btn-kirim');
        const notifForm = document.getElementById('notif-form');
        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nama = document.getElementById('inp-nama').value.trim();
            const kontak = document.getElementById('inp-kontak').value.trim();
            const kategori = document.getElementById('inp-kategori').value;
            const isi = document.getElementById('inp-isi').value.trim();
            const file = fileInput.files[0];
            
            if (!nama || !kontak || !kategori || !isi || !file) {
                notifForm.className = "alert alert-warning mt-3 d-block";
                notifForm.innerHTML = "<strong>Peringatan!</strong> Semua kolom dan bukti otentik wajib diisi/diupload.";
                window.scrollTo(0, 0); 
                return;
            }
            
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Sedang Memproses...";
            notifForm.className = "alert alert-info mt-3";
            notifForm.innerText = "Mohon tunggu, sedang mengupload laporan dan bukti...";
            notifForm.classList.remove('d-none');
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const payload = {
                    nama: nama,
                    kontak: kontak,
                    kategori: kategori,
                    isi: isi,
                    fileData: event.target.result,
                    fileName: file.name,
                    fileType: file.type
                };
                eksekusiKirim(payload);
            };
            
            reader.onerror = function() {
                alert("Gagal membaca file bukti.");
                resetTombol();
            };
            
            reader.readAsDataURL(file);
        });
        
        function eksekusiKirim(payload) {
            fetch(URL_GAS, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            })
            .then(() => {
                notifForm.className = "alert alert-success mt-3";
                notifForm.innerHTML = "<strong>Berhasil!</strong> Laporan Anda telah tersimpan ke sistem SiDul.";
                form.reset();
                resetTombol();
            })
            .catch(err => {
                console.error("Error:", err);
                notifForm.className = "alert alert-danger mt-3";
                notifForm.innerText = "Terjadi kesalahan saat mengirim. Pastikan internet stabil.";
                resetTombol();
            });
        }
        
        function resetTombol() {
            btnSubmit.disabled = false;
            btnSubmit.innerText = "KIRIM LAPORAN";
        }
    </script>
</body>
</html>
